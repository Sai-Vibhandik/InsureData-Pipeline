[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insuredata-pipeline"
version = "1.0.0"
description = "Insurance ETL pipeline and analytics workbench (synthetic data)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pandas>=3.0,<4", "numpy>=1.26,<3", "pyarrow>=15", "streamlit>=1.40", "plotly>=5.24", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
